name: Smoke Test Extensions

# Installs and loads extensions with the Ladybug releases that download them, on
# every platform the extensions are built for. Called before a deploy with the
# packaged releases tree, or dispatched to check what a repository serves now.

on:
  workflow_call:
    inputs:
      artifact:
        description: "Artifact holding the releases/ tree to test"
        type: string
        required: true
      all-patches:
        description: "Line to test with every patch release, e.g. v0.21.0"
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      repo:
        description: "Extension repository URL"
        type: string
        default: "https://extension.ladybugdb.com/"
      lines:
        description: "Space-separated lines to test, e.g. v0.21.0 (default: all)"
        type: string
        default: ""
      all-patches:
        description: "Space-separated lines to test with every patch release"
        type: string
        default: ""
      extensions:
        description: "Space-separated extensions to test (default: all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/extension

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      # The Windows wheels leave OpenSSL 3 to the user, and Python finds an extension
      # module's DLLs in the system directory, where this installer copies them.
      - name: Install OpenSSL 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dst = "$env:RUNNER_TEMP\slp_openssl.exe"
          Invoke-WebRequest -Uri "https://slproweb.com/download/Win64OpenSSL_Light-3_5_9.exe" -OutFile $dst
          Start-Process -FilePath $dst -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          if (-not (Test-Path "$env:SystemRoot\System32\libssl-3-x64.dll")) {
            Write-Error "OpenSSL DLLs were not copied to System32"
            exit 1
          }

      - name: Download the releases tree
        if: ${{ inputs.artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact }}
          path: deploy

      - name: Smoke test
        env:
          ARTIFACT: ${{ inputs.artifact }}
          REPO: ${{ inputs.repo }}
          LINES: ${{ inputs.lines }}
          ALL_PATCHES: ${{ inputs.all-patches }}
          EXTENSIONS: ${{ inputs.extensions }}
        run: |
          if [ -n "$ARTIFACT" ]; then
            source=(--serve deploy/releases)
          else
            source=(--repo "$REPO")
          fi
          # Word splitting turns the space-separated inputs into argument lists.
          # shellcheck disable=SC2086
          python scripts/extension/smoke_test.py "${source[@]}" \
            --line $LINES --all-patches $ALL_PATCHES --extension $EXTENSIONS
